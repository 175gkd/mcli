[project]
name = "mcli"
version = "0.1.0"
description = "Bridge MCP servers into Unix-style CLI tools via a thin client + auto-spawn daemon"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",
    "aiohttp>=3.9",
    "jsonschema>=4",
]

[project.scripts]
mcli = "mcli.cli:main"
mcli-daemon = "mcli.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcli"]

[dependency-groups]
dev = ["pytest>=8.0"]
